<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>India Hospital Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
}

.leaflet-control-attribution.leaflet-control { 
display: none !important;
}


/* #map{
height:400px;
width:400px;
margin:auto;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
} */

/* Responsive Map */
#map{
height:99vh; border:1px solid #ccc;
width:50%;
margin:auto;
background:white;

}

#searchBox{
margin: 0 auto;
background:white;
padding:10px;
width:250px; position: relative;
}

#searchInput{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:4px;
}

#searchResults{
max-height:200px;
overflow-y:auto;
border:1px solid #ddd;
}

.resultItem{
padding:6px;
cursor:pointer;
border-bottom:1px solid #eee;
}

.resultItem:hover{
background:#f1f1f1;
}

/* STATE LABEL STYLE */

.stateLabel{
background:transparent;
border:none;
box-shadow:none;
color:#000;
font-size:10px;
font-weight:bold;
text-align:center;
}

</style>

</head>

<body>

<div id="searchBox">

<input type="text" id="searchInput" placeholder="Search Hospital...">

<div id="searchResults"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Create map
var map = L.map('map').setView([22.9734,78.6569],5);


// Hospital data
// var hospitals = [

// { name:"AIIMS Delhi <br>Ansari Nagar-AIIMS, New Delhi, Delhi 110029", lat:28.5672, lng:77.2100 },

// { name:"Kokilaben Hospital Mumbai", lat:19.1176, lng:72.8367 },

// { name:"Apollo Hospital Chennai", lat:13.0827, lng:80.2707 },

// { name:"Manipal Hospital Bangalore", lat:12.9716, lng:77.5946 },

// { name:"KGMU Lucknow", lat:26.869, lng:80.923 }

// ];

var markers = [];


// COLOR FUNCTION
function getColor(stateName){

var colors = {
"Uttar Pradesh":"#FFCDD2",
"Maharashtra":"#F8BBD0",
"Tamil Nadu":"#E1BEE7",
"Karnataka":"#D1C4E9",
"Rajasthan":"#C5CAE9",
"Gujarat":"#BBDEFB",
"Daman and Diu":"#BBDEFB",
"Madhya Pradesh":"#B2EBF2",
"Bihar":"#C8E6C9",
"West Bengal":"#DCEDC8",
"Punjab":"#FFF9C4",
"Haryana":"#FFE0B2",
"Delhi":"#FFCCBC",
"Ladakh":"#D7CCC8",
"Ahmedabad":"#FFD45A",
"Rajkot":"#FFD45A",
"Jamnagar":"#FFD45A",
"Vadodara":"#FFD45A",
"Surat":"#FFD45A",
"Amritsar":"#FF8B5A",
"Jalandhar":"#FF8B5A",
"Jalandhar Cantonment":"#FF8B5A",
"Ludhiana":"#FF8B5A",
"Panchkula":"#FF8B5A",
"Chandigarh":"#FF8B5A"



};

return colors[stateName] || "#E0E0E0";

}


// Load India boundary
fetch("india-allstates-ad.geojson")
.then(res => res.json())
.then(data => {

function style(feature){

var stateName =
feature.properties.NAME_1 ||
feature.properties.st_nm ||
feature.properties.name;

return{
fillColor:getColor(stateName),
weight:1,
color:"#333",
fillOpacity:0.8
};

}


// INDIA MAP WITH STATE LABELS
var geojson = L.geoJSON(data,{

style:style,

onEachFeature:function(feature,layer){

var stateName =
feature.properties.NAME_1 ||
feature.properties.st_nm ||
feature.properties.name ||
"State";

layer.bindTooltip(stateName,{
fillColor: feature.properties.color,
permanent:true,
direction:"center",
className:"stateLabel"
}).openTooltip();

// Popup (shows when clicked)
layer.bindPopup(stateName);

}

}).addTo(map);

map.fitBounds(geojson.getBounds());

// Add markers
hospitals.forEach(function(h){

var marker = L.marker([h.lat,h.lng])
.bindPopup("<b>"+h.name+"</b>")
.addTo(map);

marker.name = h.name;

markers.push(marker);

});

});


// SEARCH FUNCTION
var searchInput = document.getElementById("searchInput");
var resultsBox = document.getElementById("searchResults");

searchInput.addEventListener("keyup",function(){

var query = this.value.toLowerCase();

resultsBox.innerHTML = "";

if(query.length === 0) return;

markers.forEach(function(marker){

if(marker.name.toLowerCase().includes(query)){

var div = document.createElement("div");

div.className = "resultItem";

div.innerHTML = marker.name;

div.onclick = function(){

map.setView(marker.getLatLng(),10);

marker.openPopup();

resultsBox.innerHTML = "";

searchInput.value = marker.name;

};

resultsBox.appendChild(div);

}

});

});

</script>

</body>
</html>
