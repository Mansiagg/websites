        var markers = [];
        // FIXED STATE/CITY COLOR FUNCTION
        function getColor(stateName) {
            var colors = {
                "Uttar Pradesh": "#FFCDD2",
                "Himachal Pradesh": "#d2cafb",
                "Uttarakhand": "#ebb360",
                "Arunachal Pradesh": "#fbe776",

                "Tripura": "#a9c98a",

                "Karnataka": "#D1C4E9",

                "Madhya Pradesh": "#B2EBF2",
                "Bihar": "#C8E6C9",

                "Chandigarh": "#FF8B5A",
                "Jharkhand": "#FF8B5A",
                "Chhattisgarh": "#fec28c",
                "Odisha": "#bfa1c7",
                "Hyderabad": "#f2af56",
                "Telangana": "#fadf86",
                "Andhra Pradesh":"#f2b352",
                "Jammu and Kashmir": "#e9f6a6",
                    "Kerala": "#FFD45A",
            };
            return colors[stateName] || "#E0E0E0"; // fallback gray
        }


        // Load India boundary
        fetch("india-allstates.geojson")
            .then(res => res.json())
            .then(data => {

                function style(feature) {
                    var stateName = feature.properties.NAME_1 || feature.properties.st_nm || feature.properties.name || "State";
                    return {
                        fillColor: getColor(stateName), // fixed color now
                        weight: 1,
                        color: "#333",
                        fillOpacity: 0.8
                    };
                }

                // INDIA MAP WITH STATE LABELS
                var geojson = L.geoJSON(data, {
                    style: style,

                    onEachFeature: function (feature, layer) {
                        var stateName = feature.properties.NAME_1 || feature.properties.st_nm || feature.properties.name || "State";

                        // Default tooltip options
                        var tooltipOptions = {
                            permanent: true,
                            direction: "center",
                            className: "stateLabel"
                        };

                        // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Uttar Pradesh") {
                            tooltipOptions.offset = L.point(-20, -25); // shift 20px upward
                        }

                         // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Bihar") {
                            tooltipOptions.offset = L.point(20, 5); // shift 20px upward
                        }
                         // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Punjab") {
                            tooltipOptions.offset = L.point(0, -10); // shift 20px upward
                        }

                        layer.bindTooltip(stateName, tooltipOptions).openTooltip();

                        // Popup (shows when clicked)
                        layer.bindPopup(stateName);
                    }

                }).addTo(map);

              map.fitBounds(geojson.getBounds());

// FIX MAP SIZE AFTER RENDER
setTimeout(function () {
    map.invalidateSize();
}, 200);

                

                // Add markers
                hospitals.forEach(function (h) {
                    var marker = L.marker([h.lat, h.lng])
                        .bindPopup("<b>" + h.name + "</b>")
                        .addTo(map);

                    marker.name = h.name;
                    markers.push(marker);
                });

            });

        // SEARCH FUNCTION
        var searchInput = document.getElementById("searchInput");
        var resultsBox = document.getElementById("searchResults");

        searchInput.addEventListener("keyup", function () {

            var query = this.value.toLowerCase();

            resultsBox.innerHTML = "";

            if (query.length === 0) return;

            markers.forEach(function (marker) {

                if (marker.name.toLowerCase().includes(query)) {

                    var div = document.createElement("div");

                    div.className = "resultItem";

                    div.innerHTML = marker.name;

                    div.onclick = function () {

                        map.setView(marker.getLatLng(), 12);

                        marker.openPopup();

                        resultsBox.innerHTML = "";

                        searchInput.value = marker.name;

                    };

                    resultsBox.appendChild(div);

                }

            });
            

        });
