        var markers = [];
        // FIXED STATE/CITY COLOR FUNCTION
        function getColor(stateName) {
            var colors = {
                "Uttar Pradesh": "#FFCDD2",
                "Himachal Pradesh": "#d2cafb",
                "Uttarakhand": "#ebb360",
                "Arunachal Pradesh": "#fbe776",
                "Meghalaya": "#aeb6db",
                "Assam": "#cce3c9",
                "Nagaland": "#fbc7c9",
                "Manipur": "#fdfcfa",
                "Tripura": "#a9c98a",
                "Mizoram": "#ebb360",
                "Maharashtra": "#F8BBD0",
                "Tamil Nadu": "#E1BEE7",
                "Karnataka": "#D1C4E9",
                "Rajasthan": "#C5CAE9",
                "Gujarat": "#bccf5b",
                "Daman and Diu": "#BBDEFB",
                "Madhya Pradesh": "#B2EBF2",
                "Bihar": "#C8E6C9",
                "West Bengal": "#DCEDC8",
                "Punjab": "#ffe979",
                "Haryana": "#FFE0B2",
                "Delhi": "#FFCCBC",
                "Ladakh": "#ffb5c8",
                "Ahmedabad": "#FFD45A",
                "Rajkot": "#FFD45A",
                "Jamnagar": "#FFD45A",
                "Vadodara": "#FFD45A",
                "Surat": "#FFD45A",
                "Amritsar": "#FF8B5A",
                "Jalandhar": "#FF8B5A",
                "Jalandhar Cantonment": "#FF8B5A",
                "Ludhiana": "#FF8B5A",
                "Panchkula": "#FF8B5A",
                "Chandigarh": "#FF8B5A",
                "Jharkhand": "#FF8B5A",
                "Chhattisgarh": "#fec28c",
                "Odisha": "#bfa1c7",
                "Hyderabad": "#f2af56",
                "Telangana": "#fadf86",
                "Andhra Pradesh": "#f2b352",
                "Jammu and Kashmir": "#e9f6a6",
                "Kerala": "#FFD45A",
            };
            return colors[stateName] || "#E0E0E0"; // fallback gray
        }


        // Load India boundary
        fetch("india-allstates.geojson")
            .then(res => res.json())
            .then(data => {

                function style(feature) {
                    var stateName = feature.properties.NAME_1 || feature.properties.st_nm || feature.properties.name || "State";
                    return {
                        fillColor: getColor(stateName), // fixed color now
                        weight: 1,
                        color: "#333",
                        fillOpacity: 0.8
                    };
                }

                // INDIA MAP WITH STATE LABELS
                var geojson = L.geoJSON(data, {
                    style: style,

                    onEachFeature: function (feature, layer) {
                        var stateName = feature.properties.NAME_1 || feature.properties.st_nm || feature.properties.name || "State";

                        // Default tooltip options
                        var tooltipOptions = {
                            permanent: true,
                            direction: "center",
                            className: "stateLabel"
                        };

                        // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Uttar Pradesh") {
                            tooltipOptions.offset = L.point(-20, -25); // shift 20px upward
                        }

                        // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Bihar") {
                            tooltipOptions.offset = L.point(20, 5); // shift 20px upward
                        }
                        // Add offset ONLY for Uttar Pradesh
                        if (stateName === "Punjab") {
                            tooltipOptions.offset = L.point(0, -10); // shift 20px upward
                        }

                        layer.bindTooltip(stateName, tooltipOptions).openTooltip();

                        // Popup (shows when clicked)
                        layer.bindPopup(stateName);
                    }

                }).addTo(map);

                map.fitBounds(geojson.getBounds());

                // FIX MAP SIZE AFTER RENDER
                setTimeout(function () {
                    map.invalidateSize();
                }, 200);



                // Add markers
                hospitals.forEach(function (h) {
                    var popupContent = `
<div class="labPopup">
<h3>${h.name}</h3>

<p class="labAddress">${h.address}</p>

<div class="labTests">
<b>Tests Available</b>
<p>${h.tests}</p>
</div>

<button class="labBtn booktest py-2 text-center text-white px-2">Book Test</button>
</div>
`;



                    var marker = L.marker([h.lat, h.lng])
                        .bindPopup(popupContent, {
                            maxWidth: 350,
                            minWidth: 300
                        })
                        .addTo(map);

                    marker.name = h.name;
                    markers.push(marker);
                });

            });

        // SEARCH FUNCTION
        var labSelect = document.getElementById("labSelect");

        // populate dropdown
        hospitals.forEach(function (h, index) {

            var option = document.createElement("option");

            option.value = index;
            option.text = h.name.split("<br>")[0];

            labSelect.appendChild(option);

        });

        // select event
        labSelect.addEventListener("change", function () {

            var index = this.value;

            if (index === "") return;

            var marker = markers[index];

            map.setView(marker.getLatLng(), 12);

            marker.openPopup();

        });
